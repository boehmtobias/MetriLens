[project]
name = "metrilens"
version = "0.1.0"
description = "Measurement-and-comparison harness for cross-version energy attribution, built on METRION."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Tobias Böhm", email = "boehmt@hochschule-trier.de"},
    { name = "Domenic Bechthold", email = "dmbc2635@hochschule-trier.de"},
]
dependencies = [
    "click>=8.1.7",
    "sqlalchemy>=2.0.40",
    "pydantic>=2.12.5",
    "transitions>=0.9.2",
    "numpy>=2.1.0",
    "scipy>=1.14.1",
    "matplotlib>=3.10.3",
    "playwright>=1.48.0",
    "pyyaml>=6.0.3",
    "loguru>=0.7.3",
]

[project.urls]
Repository = "https://github.com/boehmtobias/MetriLens"

[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "pytest>=8.3.0",
    "pytest-cov>=7.1.0",
]

[project.scripts]
metrilens = "metrilens.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/metrilens"]

[tool.pytest.ini_options]
pythonpath = ["scripts", "scenarios/inventree_session_flow"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
